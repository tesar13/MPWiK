name: MPWiK Facebook Scraper

permissions:
  contents: write

on:
  schedule:
    - cron: "*/10 6-20 * * *"
  workflow_dispatch:        # ręczne uruchomienie z poziomu GitHuba

jobs:
  scrape-mpwik:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.25.0 requests beautifulsoup4

      # Najlepsze i najprostsze rozwiązanie Chrome + Chromedriver w 2025
      - name: Instalacja Chromedrivera pasującego do Chrome 144
        run: |
          set -e

          # Odczytujemy wersję zainstalowanego Chrome
          CHROME_VERSION=$(google-chrome --product-version)
          echo "Chrome version: $CHROME_VERSION"

          # Pobieramy numer wersji głównej, pobocznej i builda
          CHROME_BUILD=$(echo "$CHROME_VERSION" | cut -d '.' -f 1-3)

          # Pobieramy pasującą wersję ChromeDriver
          DRIVER_VERSION=$(curl -fsSL \
            "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_BUILD}")

          echo "ChromeDriver version: $DRIVER_VERSION"

          # Usuwamy ewentualny stary sterownik
          sudo rm -f /usr/bin/chromedriver

          # Pobieramy właściwy sterownik
          wget -q \
            "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip" \
            -O /tmp/chromedriver.zip

          # Instalujemy
          unzip -q /tmp/chromedriver.zip -d /tmp/chromedriver
          sudo mv /tmp/chromedriver/chromedriver-linux64/chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver

          echo "Installed Chrome:"
          google-chrome --version

          echo "Installed ChromeDriver:"
          chromedriver --version

      - name: Run MPWiK scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python MPWiK.py

      - name: Commit last_post.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add last_post.txt

          if git diff --cached --quiet; then
            echo "Brak zmian – nie commituję"
            exit 0
          fi

          git commit -m "Update last_post"

          for i in 1 2 3; do
            echo "Próba push #$i"
            git push && break
            sleep 10
          done || echo "Push nieudany – GitHub chwilowo niedostępny"
